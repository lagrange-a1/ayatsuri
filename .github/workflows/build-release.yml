name: Build Release (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.7'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure .env exists (gitignored asset)
        run: |
          if [ ! -f .env ]; then echo '# placeholder for CI build' > .env; fi
          ls -l .env

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release, debug-signed)
        # Split-per-ABI by default (smaller per-arch APKs, standard for
        run: flutter build apk --release --split-per-abi

      - name: List outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayatsuri-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*.apk

  release:
    name: Create Release (tag only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and attach APKs
        run: |
          ls -lh dist/
          gh release create "${{ github.ref_name }}" dist/*.apk \
            --title "Ayatsuri ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
