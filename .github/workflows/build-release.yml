name: Build Release (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.7'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure .env exists (gitignored asset)
        run: |
          if [ ! -f .env ]; then echo '# placeholder for CI build' > .env; fi
          ls -l .env

      - name: Get dependencies
        run: flutter pub get

      # Release signing: every tagged release must use the SAME keystore,
      # otherwise phones with an older install reject the new APK
      # (signature mismatch -> getPackageInfo null / cannot install).
      # Required GitHub Secrets (one-time setup):
      #   KEYSTORE_BASE64    base64 of the .jks/.keystore file
      #   KEYSTORE_PASSWORD  keystore password
      #   KEY_ALIAS          key alias inside the keystore
      #   KEY_PASSWORD       key password (may equal KEYSTORE_PASSWORD)
      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore written."
          else
            echo "::warning::No KEYSTORE_BASE64 secret: falling back to debug signing. Tagged (v*) builds will fail in Gradle on purpose."
          fi

      - name: Build APK (release, split-per-ABI)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: List outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayatsuri-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*.apk

  release:
    name: Create Release (tag only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and attach APKs
        run: |
          ls -lh dist/
          gh release create "${{ github.ref_name }}" dist/*.apk \
            --title "Ayatsuri ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
