name: Build Release (Android)

on:
  workflow_dispatch:
    inputs:
      split_per_abi:
        description: 'Build split-per-abi APKs'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure .env exists (gitignored asset)
        run: |
          if [ ! -f .env ]; then echo '# placeholder for CI build' > .env; fi
          ls -l .env

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release, debug-signed)
        # Split-per-ABI by default (smaller per-arch APKs, standard for
        # GitHub releases). workflow_dispatch inputs are empty on tag
        # pushes, so fall back to 'true' unless explicitly disabled.
        env:
          SPLIT_PER_ABI: ${{ inputs.split_per_abi || 'true' }}
        run: |
          if [ "$SPLIT_PER_ABI" = "true" ]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --release
          fi

      - name: List outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayatsuri-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*.apk

  release:
    name: Create Release (tag only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and attach APKs
        run: |
          ls -lh dist/
          gh release create "${{ github.ref_name }}" dist/*.apk \
            --title "Ayatsuri ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
