name: Build Release (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.7'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure .env exists (gitignored asset)
        run: |
          if [ ! -f .env ]; then echo '# placeholder for CI build' > .env; fi
          ls -l .env

      - name: Get dependencies
        run: flutter pub get

      # Release signing: every CI build must use the SAME keystore,
      # otherwise phones with an older install reject the new APK
      # (signature mismatch -> getPackageInfo null / cannot install).
      # Required GitHub Secrets (one-time setup):
      #   KEYSTORE_BASE64    base64 of the .jks/.keystore file
      #   KEYSTORE_PASSWORD  keystore password
      #   KEY_ALIAS          key alias inside the keystore
      #   KEY_PASSWORD       key password (may equal KEYSTORE_PASSWORD)
      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_STORE_PASSWORD" ] && missing+=("KEY_STORE_PASSWORD")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secret(s): ${missing[*]}. All four secrets (KEYSTORE_BASE64, KEY_ALIAS, KEY_STORE_PASSWORD, KEY_PASSWORD) are required on any CI build; refusing to proceed to avoid a debug-signed APK."
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"
          echo "Release keystore written."

      - name: Build APK (release, split-per-ABI)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: List outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR="$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::No build-tools found under ANDROID_HOME=$SDK_ROOT"
            exit 1
          fi
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using apksigner: $APKSIGNER"
          shopt -s nullglob
          apks=()
          for apk in build/app/outputs/flutter-apk/*.apk; do apks+=("$apk"); done
          shopt -u nullglob
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APKs found in build/app/outputs/flutter-apk/"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            if ! cert_output="$("$APKSIGNER" verify --print-certs "$apk" 2>&1)"; then
              echo "$cert_output"
              echo "::error::apksigner verify failed for $apk"
              exit 1
            fi
            echo "$cert_output"
            if echo "$cert_output" | grep -qi "Android Debug"; then
              echo "::error::APK $apk is debug-signed (certificate DN contains 'Android Debug'); refusing to upload"
              exit 1
            fi
          done
          echo "All APKs verified as release-signed."

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayatsuri-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*.apk

  release:
    name: Create Release (tag only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and attach APKs
        run: |
          ls -lh dist/
          gh release create "${{ github.ref_name }}" dist/*.apk \
            --title "Ayatsuri ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
