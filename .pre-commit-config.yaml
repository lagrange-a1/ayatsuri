repos:
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format . --set-exit-if-changed
        language: system
        types_or: [dart]
        pass_filenames: false
      - id: dart-analyze
        name: dart analyze
        entry: sh -c 'flutter pub get --quiet && exec dart analyze --fatal-warnings'
        language: system
        types_or: [dart]
        pass_filenames: false
