name: flutter_earth_globe
# Vendored fork for Ayatsuri (upstream 2.2.1): CPU fallback rendering
# fixes in lib/rotating_globe.dart — cached sphere future (no blank
# flash while dragging) and longitude mirror correction. Keep in sync
# with upstream when it ships fixes for these.
description: "An interactive and fully customizable 3D Globe widget written in pure Dart."
version: 2.2.1+ayatsuri.1
homepage: https://github.com/Pana-g/flutter_earth_globe
repository: https://github.com/Pana-g/flutter_earth_globe

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  vector_math: ^2.1.4
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  shaders:
    - shaders/sphere.frag
    - shaders/background.frag